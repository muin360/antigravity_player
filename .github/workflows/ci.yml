name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Build, Test & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Secret & Credential Leakage Scanner
        run: |
          echo "Scanning repository for committed credentials, private keys, and passwords..."
          if git grep -i -E "BEGIN (RSA|EC|DSA|OPENSSH) PRIVATE KEY" -- ':!*.md' ':!.github/workflows/ci.yml'; then
            echo "ERROR: Private key detected in repository!"
            exit 1
          fi
          if git grep -E "antigravity_release_pass" -- ':!*.md' ':!.github/workflows/ci.yml'; then
            echo "ERROR: Plaintext password detected in repository!"
            exit 1
          fi
          echo "No committed secrets detected."

      - name: Setup Ephemeral Non-Production Signing Key for CI
        run: |
          CI_KEY_PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v -keystore /tmp/ci_verification.keystore -alias ci_verify \
            -keyalg RSA -keysize 2048 -validity 1 \
            -storepass "$CI_KEY_PASS" -keypass "$CI_KEY_PASS" \
            -dname "CN=AntigravityCI, OU=Testing, O=Antigravity, L=SanFrancisco, ST=CA, C=US"
          echo "CI_KEYSTORE_PATH=/tmp/ci_verification.keystore" >> $GITHUB_ENV
          echo "CI_KEYSTORE_PASS=$CI_KEY_PASS" >> $GITHUB_ENV
          echo "CI_KEY_ALIAS=ci_verify" >> $GITHUB_ENV

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Run Android Lint
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Assemble Release APK (R8 & Minification Verification)
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          ANTIGRAVITY_RELEASE_STORE_FILE: ${{ env.CI_KEYSTORE_PATH }}
          ANTIGRAVITY_RELEASE_STORE_PASSWORD: ${{ env.CI_KEYSTORE_PASS }}
          ANTIGRAVITY_RELEASE_KEY_ALIAS: ${{ env.CI_KEY_ALIAS }}
          ANTIGRAVITY_RELEASE_KEY_PASSWORD: ${{ env.CI_KEYSTORE_PASS }}

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
